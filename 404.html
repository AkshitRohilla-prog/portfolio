<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Akshit Rohilla</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F3F8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <!-- Root-relative paths so this page also works for deep missing URLs on Vercel / Netlify / GitHub Pages user sites. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem var(--gutter); position: relative; overflow: hidden; isolation: isolate; }
    .nf::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(40% 45% at 50% 45%, rgba(var(--glow-rgb), .55), transparent 70%); }
    .nf__code { font-family: var(--font-mono); letter-spacing: .3em; color: var(--accent-text); font-size: var(--fs-sm); margin-bottom: 1rem; }
    .nf h1 { font-size: var(--fs-xl); }
    .nf p { color: var(--muted); margin: 1rem auto 2rem; max-width: 32rem; }
    .nf .brand__mark { margin: 0 auto 2rem; width: 52px; height: 52px; font-size: 1.1rem; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <span class="brand__mark" aria-hidden="true">AR</span>
      <p class="nf__code">404</p>
      <h1>This page took a wrong turn.</h1>
      <p>The address you followed doesn't exist here. The rest of the site is one click away.</p>
      <a class="btn btn--primary" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
